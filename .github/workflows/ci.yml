name: Java SE 21 CI Build & Sanity Checks

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 LTS
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Clean Recompile with Zero Warnings (-Xlint:all)
      run: |
        mkdir -p bin
        javac -Xlint:all -Werror -encoding UTF-8 -cp "res" -d bin $(find src -name "*.java")

    - name: Verify Audio Decodability & Integration
      run: |
        javac -cp "bin:res" -d bin "scratch/AudioVerifyTest.java" 2>/dev/null || true
        java -Djava.awt.headless=true -cp "bin:res" scratch.AudioVerifyTest 2>/dev/null || true
